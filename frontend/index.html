<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Topical — all you need is a topic</title>
  <meta name="description" content="Topical is a writing environment where you and an AI work the same document at once. It researches, drafts, cites and checks; you steer, judge and decide. Every claim traced to its source; Markdown, MDX and LaTeX." />
  <meta name="theme-color" content="#faf9f5" />
</head>

<body>
  <script>
    // Resolve the theme before the first paint. Doing this in React shows a
    // frame of the wrong colours on every load, which is worse than no dark
    // mode at all.
    (function () {
      try {
        var saved = localStorage.getItem('topical_theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.dataset.glass = localStorage.getItem('topical_glass') === 'tinted' ? 'tinted' : 'clear';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
